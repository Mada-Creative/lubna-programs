<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — د. لبنى كعبية</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="container navbar">
      <div class="logo">
        <a href="index.html" class="logo-text">د. لبنى كعبية</a>
        <span class="logo-tagline">توجيه مهني • تربوي • نفسي • اجتماعي • إرشاد أسري</span>
      </div>
      
      <button class="menu-toggle" id="menuToggle" aria-label="افتح قائمة التنقل" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <nav class="nav-links" id="navLinks" role="navigation" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#catalog">الكتالوج</a>
        <a href="index.html#contact">تواصل معنا</a>
      </nav>
      <div class="nav-overlay" id="navOverlay"></div>
    </div>
  </header>

  <main class="container detail-layout" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="empty-state" style="max-width: 500px; padding: 48px 24px;">
      <div class="empty-state-icon" aria-hidden="true" style="font-size: 4rem;">⚠️</div>
      <h1 style="font-size: 2rem; margin-top: 16px; margin-bottom: 8px;">عذرًا، الصفحة غير موجودة</h1>
      <p style="font-size: 1.1rem; line-height: 1.7; margin-bottom: 24px; color: var(--color-text-muted);">
        يبدو أن الرابط الذي اتبعته تالف، أو أن الصفحة قد تم نقلها أو تعديل مسارها في لوحة التحكم.
      </p>
      <a href="index.html" class="btn btn-primary">العودة للصفحة الرئيسية</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-copyright">
      <p>&copy; <span id="currentYear">2026</span> د. لبنى كعبية. جميع الحقوق محفوظة.</p>
      <p class="mada-credit">Developed by <a href="#" id="madaLink" target="_blank" rel="noopener noreferrer">Mada</a></p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>

  <script>
    // Set current year
    const yearSpan = document.getElementById("currentYear");
    if (yearSpan) yearSpan.textContent = new Date().getFullYear();

    // Mobile menu toggle
    const toggle = document.getElementById("menuToggle");
    const nav = document.getElementById("navLinks");
    const overlay = document.getElementById("navOverlay");
    
    if (toggle && nav && overlay) {
      const elements = [toggle, overlay];
      elements.forEach(el => {
        el.addEventListener("click", () => {
          const active = nav.classList.toggle("active");
          overlay.classList.toggle("active");
          toggle.setAttribute("aria-expanded", active ? "true" : "false");
        });
      });
    }
  </script>
</body>
</html>
